name: Build pages and preview cards
# Push a new or edited file in _build/content/ and this rebuilds the HTML pages,
# the sitemap and every link-preview card (og/*.jpg), then commits them back.
on:
  push:
    branches: [main]
    paths:
      - '_build/content/**'
      - '_build/build.py'
      - '_build/figures.py'
      - '_build/og.py'
      - '_build/shortlinks.json'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and fonts
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm install --no-save --prefix /tmp/fonts @fontsource-variable/archivo@5.3.0 @fontsource/instrument-serif@5.3.0 @fontsource/jetbrains-mono@5.3.0 @fontsource/public-sans@5.3.0
      - name: Build pages
        run: python3 _build/build.py
      - name: Render preview cards
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          FONTS=/tmp/fonts/node_modules BASE=http://localhost:8765 python3 _build/og.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog projects tools og sitemap.xml _build/urls.txt
          git add -A $(python3 -c "import json;print(' '.join(json.load(open('_build/shortlinks.json'))))")
          if git diff --cached --quiet; then echo "Nothing changed"; else git commit -m "Build pages and preview cards" && git push; fi
