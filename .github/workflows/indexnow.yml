name: IndexNow ping
# Tells Bing, Yandex, Seznam and other IndexNow engines that the site changed.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Submit URLs to IndexNow
        run: |
          curl -sS --fail-with-body -w "\nHTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"gibin.in","key":"7b10cfa22ac315815959883d3525d19f","keyLocation":"https://gibin.in/7b10cfa22ac315815959883d3525d19f.txt","urlList":["https://gibin.in/","https://gibin.in/llms.txt"]}'
