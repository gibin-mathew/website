name: IndexNow ping
# Tells Bing, Yandex, Seznam and other IndexNow engines that the site changed.
# The URL list comes from _build/urls.txt, which the page build keeps up to date.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Submit URLs to IndexNow
        run: |
          BODY=$(python3 -c "import json;u=[l.strip() for l in open('_build/urls.txt') if l.strip()]+['https://gibin.in/llms.txt','https://gibin.in/sitemap.xml'];print(json.dumps({'host':'gibin.in','key':'7b10cfa22ac315815959883d3525d19f','keyLocation':'https://gibin.in/7b10cfa22ac315815959883d3525d19f.txt','urlList':u}))")
          curl -sS --fail-with-body -w "\nHTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
