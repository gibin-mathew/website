<script>
/* Short links: gibin.in/<name> lands on the homepage and is counted.
   gibin.in/dolby  -> referrer "resume", campaign "dolby"
   gibin.in/cv     -> referrer "resume"
   gibin.in/linkedin, /github, /whatsapp, /email -> referrer of that name */
(function(){
  var slug=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
  var dest='/';
  if(/^[a-z0-9][a-z0-9-]{0,39}$/.test(slug)){
    var channels={linkedin:1,github:1,whatsapp:1,email:1,instagram:1,x:1,naukri:1};
    if(slug==='cv'||slug==='resume') dest='/?ref=resume';
    else if(channels[slug]) dest='/?ref='+slug;
    else dest='/?ref=resume&utm_campaign='+encodeURIComponent(slug);
  }
  location.replace(dest+location.hash);
})();
</script>
